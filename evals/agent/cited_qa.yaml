# cited_qa.yaml — questions answerable from real, verified rows in the local
# database (source_key: bureau_of_experts — the only tuned/verified scraper
# as of this eval's creation).
#
# Every expected_title / expected_url below was read directly out of
# data/regulations.db (see evals/agent/README.md for how it was generated,
# and re-generate before relying on this file if the database has since
# changed). The agent is expected to answer with a real citation matching
# these fields; the runner checks that the cited URL is present, resolves,
# and that the cited title matches the stored one.
#
# Schema per item:
#   id               short stable identifier
#   question         natural-language question to put to the agent
#   expected_title   exact `title` value stored in the regulations table
#   expected_url     exact `url` value stored in the regulations table
#   source_key       which tracked source the row comes from
#   published_gregorian  the stored Gregorian publication date, for reference

