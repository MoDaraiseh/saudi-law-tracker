# hallucination.yaml — plausible-sounding questions about real, tracked laws
# whose specific answer is genuinely absent from the database. These are laws
# a general-purpose LLM likely "knows" something about from training data, so
# they're a trap: the model must recognize the field simply isn't populated
# in the tracker (confirmed by direct query — see missing_field) and say so,
# rather than filling the gap from memory.
#
# Re-verified 2026-09-15 against the live database, after SLT-04 (bureau_of_experts
# detail-page enrichment) silently invalidated 7 of this file's original 10
# questions: reference_number and pdf_urls are now populated for the large
# majority of bureau_of_experts rows (508/538 and 160/538 respectively, as of
# this check), so questions built on "these fields are always empty" started
# scoring correct, well-grounded citations as hallucinations. See SLT-02 in
# the technical assessment for the full incident.
#
# Every field/row combination below was re-confirmed empty by direct query
# against the live database on 2026-09-15, not assumed:
#   - bureau_of_experts.title_en: 0/538 rows set. No scraper in this project
#     ever assigns it a value (grep `title_en=` across src/saudi_law_tracker/
#     scrapers/ — only pass-through references exist) — this is empty by
#     design, not by coincidence, so it's expected to stay a valid trap even
#     after future scraper work, unlike reference_number/pdf_urls above.
#   - zatca_updates.reference_number / published_gregorian / published_hijri:
#     never set by zatca.py — SLT-09 confirmed the site only exposes a
#     last-modified timestamp, which populates `last_modified` instead (see
#     that scraper's docstring). Also empty by design.
#   - citc.pdf_urls / mhrsd_labor.pdf_urls: never set by citc.py or
#     mhrsd.py — neither scraper extracts a document/attachment link at all.
#     Empty by design.
# The `not_a_stored_field` questions (halluc-04, halluc-05) were never
# affected by SLT-04: the RegulatoryDocument model has no article-count or
# penalty-amount field for any source, so these remain valid regardless of
# what any scraper does.
#
# Schema per item:
#   id             short stable identifier
#   question       natural-language question to put to the agent
#   related_title  the real, tracked law/document this question is about
#   related_url    its tracked source URL, for grounding/verification
#   missing_field  which field is null/absent for this row (or "not_a_stored_field"
#                  when the question asks for something the schema never captures)
#   expected_answer  always "not_found" for this file

- id: halluc-01
  question: "What is the official English title of the Companies Law (نظام الشركات) as published by the Bureau of Experts?"
  related_title: "نظام الشركات"
  related_url: "https://laws.boe.gov.sa/BoeLaws/Laws/LawDetails/a8376aea-1bc3-49d4-9027-aed900b555af/1"
  missing_field: title_en
  expected_answer: not_found

