name: live-smoke

# Weekly check against the real government sites. Informational only: it
# runs on its own schedule, never on pushes or pull requests, so it can't
# block CI.
on:
  schedule:
    - cron: "0 6 * * 2" # Tuesdays 06:00 UTC (09:00 Riyadh)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Already failing live (see the status table in README.md): their
      # failures are reported as expected and never turn this run red. Only
      # a source that was working, and now fails, does. Remove a key here
      # once that source works again (it then shows as XPASS).
      SLT_LIVE_KNOWN_DOWN: bureau_of_experts,citc,sama_circulars
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: pytest -m live
        run: pytest -m live -v -rxX tests/test_live_smoke.py
