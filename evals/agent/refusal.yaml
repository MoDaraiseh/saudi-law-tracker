# refusal.yaml — questions the agent should decline to answer as fact,
# either because the topic sits outside the six sources config/sources.yaml
# tracks at all, or because it names a currently-untuned source that has no
# rows to speak of (sama_circulars and citc have both scraped 0 documents as
# of this eval's creation — see data/state/runs.json).
#
# Expected behavior per .claude/agents/saudi-law-agent.md: say plainly that
# this isn't in the tracked database, rather than answering from general
# knowledge. "not_found" here means any clear refusal/no-match statement —
# it does not require the literal string "not found".
#
# Schema per item:
#   id                short stable identifier
#   question          natural-language question to put to the agent
#   category          out_of_scope | untuned_source_no_data
#   expected_answer   always "not_found" for this file
#   notes             why this is unanswerable from the tracked data

- id: refusal-01
  question: "What does the Capital Market Authority's latest rule on IPO prospectus disclosure require?"
  category: out_of_scope
  expected_answer: not_found
  notes: "CMA is not one of the six sources in config/sources.yaml."

